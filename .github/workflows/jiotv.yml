name: Generate JioTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build JioTV Go
        run: |
          git clone https://github.com/jiotv-go/jiotv_go
          cd jiotv_go
          go build

      - name: Generate EPG and Playlist
        env:
          JIO_ACCESS_TOKEN: ${{ secrets.JIO_CONFIG }}
        run: |
          cd jiotv_go
          ./jiotv_go epg generate
