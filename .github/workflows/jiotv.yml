name: Generate JioTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build and Run JioTV Go
      env:
        JIO_CONFIG: ${{ secrets.JIO_CONFIG }}
      run: |
        mkdir -p ~/.jiotv_go
        echo "$JIO_CONFIG" > ~/.jiotv_go/config.toml

        git clone https://github.com/jiotv-go/jiotv_go temp_jiotv
        cd temp_jiotv
        go build -o jiotv_go

        # Start the server in background
        ./jiotv_go run &
        SERVER_PID=$!
        
        # Wait for server to start
        sleep 5

        # Download playlist and epg from the local running server
        curl -s http://127.0.0.1:5001/playlist.m3u -o ../playlist.m3u || true
        curl -s http://127.0.0.1:5001/epg.xml -o ../epg.xml || true

        # Kill the server process
        kill $SERVER_PID || true
        cd ..
        rm -rf temp_jiotv

    - name: Commit and Push Playlist
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git status
        git add playlist.m3u epg.xml || true
        git commit -m "Auto-update playlist and epg [skip ci]" || echo "No changes to commit"
        git push || true
