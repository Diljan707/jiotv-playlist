name: Generate JioTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build and Run JioTV Go
      env:
        JIO_CONFIG: ${{ secrets.JIO_CONFIG }}
      run: |
        mkdir -p ~/.jiotv_go
        echo "$JIO_CONFIG" > ~/.jiotv_go/config.toml

        git clone https://github.com/jiotv-go/jiotv_go temp_jiotv
        cd temp_jiotv
        go build -o jiotv_go

        # Run with correct epg subcommand or check default export
        for i in {1..3}; do
          ./jiotv_go epg || ./jiotv_go run & 
          sleep 10
          pkill jiotv_go || true
          break
        done
        
        # If playlist is generated in current or config dir, copy it
        find . -name "*.m3u" -exec cp {} ../playlist.m3u \; || true
        find . -name "*.xml" -exec cp {} ../epg.xml \; || true
        cd ..
        rm -rf temp_jiotv

    - name: Commit and Push Playlist
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add playlist.m3u epg.xml
        git commit -m "Auto-update playlist and epg [skip ci]" || exit 0
        git push
